<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario PATIO SUPPLY</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background-image:url("proyec.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.contenedor{
    max-width:1200px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    color:#0078D7;
}

input{
    padding:10px;
    margin:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.btn-agregar{
    background:#28a745;
}

.btn-retirar{
    background:#dc3545;
}

.btn-excel{
    background:#217346;
}

.btn-pdf{
    background:#e63946;
}

.btn-eliminar{
    background:#ff6600;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0078D7;
    color:white;
}

#historial{
    margin-top:20px;
    max-height:200px;
    overflow:auto;
    border:1px solid #ddd;
    padding:10px;
    background:#f7f7f7;
}

.stock-bajo{
    color:red;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="contenedor">

<h1>📦 INVENTARIO PATIO SUPPLY</h1>

<h3>Registrar Producto</h3>

<input type="text" id="codigo" placeholder="Código">
<input type="text" id="producto" placeholder="Producto">
<input type="text" id="descripcion" placeholder="Descripción">
<input type="number" id="cantidad" placeholder="Cantidad">

<button class="btn-agregar" onclick="agregar()">
Agregar
</button>

<hr>

<h3>Retirar Stock</h3>

<input type="text" id="retCodigo" placeholder="Código">
<input type="number" id="retCantidad" placeholder="Cantidad">

<button class="btn-retirar" onclick="retirar()">
Retirar
</button>

<hr>

<input
type="text"
id="buscar"
placeholder="Buscar producto..."
onkeyup="mostrar()">

<table>

<thead>
<tr>
<th>Código</th>
<th>Producto</th>
<th>Descripción</th>
<th>Stock</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

<button class="btn-excel" onclick="exportarExcel()">
📊 Exportar Excel
</button>

<button class="btn-pdf" onclick="exportarPDF()">
📄 Exportar PDF
</button>

<h3>Historial de Movimientos</h3>

<div id="historial"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
s://cdnjs.cloudflare.com/ajax/libsjspdf.umd.min.jsscript>

<script>

let inventario=
JSON.parse(localStorage.getItem("inventario")) || [];

let historial=
JSON.parse(localStorage.getItem("historial")) || [];

mostrar();
mostrarHistorial();

function agregar(){

let codigo=document.getElementById("codigo").value.trim();
let producto=document.getElementById("producto").value.trim();
let descripcion=document.getElementById("descripcion").value.trim();
let cantidad=parseInt(document.getElementById("cantidad").value);

if(!codigo || !producto || cantidad<=0){
alert("Complete los datos");
return;
}

let existe=inventario.find(x=>x.codigo===codigo);

if(existe){

existe.cantidad+=cantidad;

}else{

inventario.push({
codigo,
producto,
descripcion,
cantidad
});

}

registrarMovimiento(
"INGRESO",
codigo,
cantidad
);

guardar();
mostrar();

document.getElementById("codigo").value="";
document.getElementById("producto").value="";
document.getElementById("descripcion").value="";
document.getElementById("cantidad").value="";
}

function retirar(){

let codigo=document.getElementById("retCodigo").value.trim();
let cantidad=parseInt(document.getElementById("retCantidad").value);

let existe=inventario.find(
x=>x.codigo===codigo
);

if(!existe){
alert("Código no encontrado");
return;
}

if(existe.cantidad<cantidad){
alert("Stock insuficiente");
return;
}

existe.cantidad-=cantidad;

registrarMovimiento(
"SALIDA",
codigo,
cantidad
);

guardar();
mostrar();

document.getElementById("retCodigo").value="";
document.getElementById("retCantidad").value="";
}

function eliminarProducto(codigo){

if(!confirm("¿Eliminar producto?")){
return;
}

inventario=inventario.filter(
x=>x.codigo!==codigo
);

guardar();
mostrar();

}

function registrarMovimiento(
tipo,
codigo,
cantidad
){

let fecha=new Date().toLocaleString();

historial.unshift(
`${fecha} | ${tipo} | ${codigo} | ${cantidad}`
);

localStorage.setItem(
"historial",
JSON.stringify(historial)
);

mostrarHistorial();

}

function mostrarHistorial(){

let div=
document.getElementById("historial");

div.innerHTML=
historial.join("<br>");

}

function guardar(){

localStorage.setItem(
"inventario",
JSON.stringify(inventario)
);

}

function mostrar(){

let filtro=
document.getElementById("buscar").value.toLowerCase();

let tabla=
document.getElementById("tabla");

tabla.innerHTML="";

inventario
.filter(item =>
item.producto.toLowerCase().includes(filtro) ||
item.codigo.toLowerCase().includes(filtro)
)
.forEach(item=>{

let clase=
item.cantidad<=5
? "stock-bajo"
: "";

tabla.innerHTML += `
<tr>
<td>${item.codigo}</td>
<td>${item.producto}</td>
<td>${item.descripcion}</td>
<td class="${clase}">${item.cantidad}</td>
<td>
<button
class="btn-eliminar"
onclick="eliminarProducto('${item.codigo}')">
Eliminar
</button>
</td>
</tr>
`;

});

}

function exportarExcel(){

let hoja=
XLSX.utils.json_to_sheet(inventario);

let libro=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
libro,
hoja,
"Inventario"
);

XLSX.writeFile(
libro,
"Inventario_PATIO_SUPPLY.xlsx"
);

}

async function exportarPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFontSize(18);

doc.text(
"INVENTARIO PATIO SUPPLY",
20,
20
);

let y=35;

inventario.forEach(item=>{

doc.text(
`${item.codigo} - ${item.producto} - ${item.cantidad}`,
20,
y
);

y+=10;

if(y>270){
doc.addPage();
y=20;
}

});

doc.save(
"Inventario_PATIO_SUPPLY.pdf"
);

}

</script>

</body>
</html>
