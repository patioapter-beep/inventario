<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario PATIO SUPPLY</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;

    /* Imagen de fondo */
    background-image: url("proyec.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Contenedor principal */
.contenedor{
    max-width: 900px;
    margin: auto;
    background: rgba(255,255,255,0.92);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

h2,h3{
    text-align:center;
    color:#0078D7;
}

input{
    padding:10px;
    margin:5px;
    width:200px;
}

button{
    padding:10px 20px;
    color:white;
    background:#0078D7;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#005fa3;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#0078D7;
    color:white;
}

.total{
    margin-top:15px;
    font-weight:bold;
    text-align:right;
    color:#0078D7;
}

</style>
</head>

<body>

<div class="contenedor">

    <h2>📦 Inventario PATIO SUPPLY</h2>

    <h3>Ingresar Producto</h3>

    <input type="text" id="producto" placeholder="Producto">
    <input type="number" id="cantidad" placeholder="Cantidad">

    <button onclick="agregar()">
        Agregar
    </button>

    <hr>

    <h3>Retirar Stock</h3>

    <input type="text" id="retProducto" placeholder="Producto">
    <input type="number" id="retCantidad" placeholder="Cantidad">

    <button onclick="retirar()">
        Retirar
    </button>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
            </tr>
        </thead>

        <tbody id="tabla"></tbody>
    </table>

    <div class="total" id="totalProductos"></div>

</div>

<script>

let inventario =
JSON.parse(localStorage.getItem("inventario")) || [];

mostrar();

function agregar(){

    let prod =
    document.getElementById("producto").value.trim();

    let cant =
    parseInt(document.getElementById("cantidad").value);

    if(!prod || cant <= 0){
        alert("Ingrese un producto y cantidad válida");
        return;
    }

    let existe =
    inventario.find(
        x => x.producto.toLowerCase() === prod.toLowerCase()
    );

    if(existe){
        existe.cantidad += cant;
    }else{
        inventario.push({
            producto: prod,
            cantidad: cant
        });
    }

    guardar();
    mostrar();

    document.getElementById("producto").value="";
    document.getElementById("cantidad").value="";
}

function retirar(){

    let prod =
    document.getElementById("retProducto").value.trim();

    let cant =
    parseInt(document.getElementById("retCantidad").value);

    let existe =
    inventario.find(
        x => x.producto.toLowerCase() === prod.toLowerCase()
    );

    if(!existe){
        alert("Producto no encontrado");
        return;
    }

    if(cant <= 0){
        alert("Cantidad inválida");
        return;
    }

    if(existe.cantidad < cant){
        alert("Stock insuficiente");
        return;
    }

    existe.cantidad -= cant;

    if(existe.cantidad === 0){
        inventario =
        inventario.filter(
            x => x.producto !== existe.producto
        );
    }

    guardar();
    mostrar();

    document.getElementById("retProducto").value="";
    document.getElementById("retCantidad").value="";
}

function guardar(){

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

}

function mostrar(){

    let tabla =
    document.getElementById("tabla");

    tabla.innerHTML = "";

    let total = 0;

    inventario.forEach(item=>{

        total += item.cantidad;

        tabla.innerHTML += `
        <tr>
            <td>${item.producto}</td>
            <td>${item.cantidad}</td>
        </tr>`;
    });

    document.getElementById("totalProductos").innerHTML =
    "Total de unidades en inventario: " + total;
}

</script>

</body>
</html>
